name: Build and Push Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: skalenetwork/machinepal

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Add this step to generate metadata (Date, Version, Git SHA)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # This ensures you keep your 'latest' tag
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          # 2. Use the outputs from the meta step
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test Docker image
        run: |
          mkdir machinepal_project
          docker run --rm -v "$(pwd)/machinepal_project:/machinepal" -e PUID=$(id -u) -e PGID=$(id -g) --ulimit nofile=65535:65535 ghcr.io/skalenetwork/machinepal:latest init
          docker run -d \
            --name machinepal \
            --restart unless-stopped \
            --network host \
            -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$(pwd)/machinepal_project:/machinepal" \
            ghcr.io/skalenetwork/machinepal
          sleep 10 
          docker run --rm --network host -e PUID=$(id -u) -e PGID=$(id -g) \
          -v "$(pwd)/machinepal_project:/machinepal" ghcr.io/skalenetwork/machinepal client --url http://localhost:8080/hello_world.txt






 



