[project]
name = "agenti"
version = "0.1.0"
description = "Give AI agents the ability to pay with cryptocurrency"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "eth-account>=0.11",
    "solders>=0.21",
]

[project.optional-dependencies]
crewai = ["crewai>=0.51"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
