name = "agenti"
main = "src/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/x/*", "/mcp"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "agenti-demo"
database_id = "ddcb4d22-bfb5-4b6e-a13a-fda1a3c115b3"
